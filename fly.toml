app = "hyperplex"
primary_region = "iad"

[env]
  NODE_ENV = "production"
  PUBLIC_URL = "https://hyperplex.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  # one always-on machine: inboxes, live host calls and long polls are coordinated in its memory
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 800

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
